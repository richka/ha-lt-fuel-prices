name: Validate with Marketplace

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-marketplace:
    # The Marketplace catalog uses the HACS action for repository validation.
    # It refuses private repositories; it starts validating as soon as the
    # repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Marketplace validation
        uses: hacs/action@main
        with:
          category: integration
